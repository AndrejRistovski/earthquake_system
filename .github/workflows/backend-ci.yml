name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/earthquake_backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/earthquake_backend/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: backend/earthquake_backend

jobs:
  build-and-test:
    name: Build, test, JaCoCo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/earthquake_backend/pom.xml

      - name: Verify (compile, unit + integration tests, JaCoCo)
        run: ./mvnw -B -ntp clean verify

      - name: Upload JaCoCo HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/earthquake_backend/target/site/jacoco
          if-no-files-found: warn

      - name: Upload Surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/earthquake_backend/target/surefire-reports
          if-no-files-found: ignore

  docker:
    name: Validate compose & build/push image
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docker-compose (full stack)
        run: docker compose --profile app config -q

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticate only when we'll actually push (push to main, not PRs).
      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend/earthquake_backend
          file: backend/earthquake_backend/Dockerfile
          # Build-only on PRs; build + push on push to main.
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/earthquake-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/earthquake-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
