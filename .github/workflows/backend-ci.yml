name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/earthquake_backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/earthquake_backend/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: backend/earthquake_backend

jobs:
  build-and-test:
    name: Build, test, JaCoCo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/earthquake_backend/pom.xml

      - name: Verify (compile, unit + integration tests, JaCoCo)
        run: ./mvnw -B -ntp clean verify

      - name: Upload JaCoCo HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/earthquake_backend/target/site/jacoco
          if-no-files-found: warn

      - name: Upload Surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/earthquake_backend/target/surefire-reports
          if-no-files-found: ignore

  docker:
    name: Validate compose & build/push image
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docker-compose (full stack)
        run: docker compose --profile app config -q

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticate only when we'll actually push (push to main, not PRs).
      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend/earthquake_backend
          file: backend/earthquake_backend/Dockerfile
          # Build-only on PRs; build + push on push to main.
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/earthquake-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/earthquake-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # CD trigger: pin this commit's image into the manifest and commit it back to
  # main. Argo CD (running in the cluster) detects the commit and rolls it out.
  bump-manifest:
    name: Pin image & let Argo CD deploy
    needs: docker
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write              # push the image-tag bump back to main
    # Shared group name serializes this with the frontend workflow's bump job so
    # two concurrent pushes don't race on `git push`.
    concurrency:
      group: manifest-bump
      cancel-in-progress: false
    defaults:
      run:
        working-directory: .       # repo root, not backend/earthquake_backend
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Pin backend image to this commit
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/earthquake-backend:${{ github.sha }}"
          # select() scopes the update to the Deployment doc only, leaving the
          # ConfigMap/Service docs in the same file untouched.
          yq -i "(select(.kind == \"Deployment\") | .spec.template.spec.containers[0].image) = \"$IMAGE\"" k8s/20-backend.yml

      - name: Commit & push the bump (Argo CD syncs from here)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- k8s/20-backend.yml; then
            echo "Backend image already pinned to ${GITHUB_SHA}; nothing to commit."
            exit 0
          fi
          git add k8s/20-backend.yml
          git commit -m "ci(cd): deploy backend ${GITHUB_SHA::7} [skip ci]"
          git pull --rebase origin main
          git push
