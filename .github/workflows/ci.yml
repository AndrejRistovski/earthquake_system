name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'frontend/earthquake_frontend/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/earthquake_frontend/**'
      - '.github/workflows/ci.yml'

defaults:
  run:
    working-directory: frontend/earthquake_frontend

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/earthquake_frontend/.nvmrc
          cache: 'npm'
          cache-dependency-path: frontend/earthquake_frontend/package-lock.json

      - name: Install (locked)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit + component tests
        run: npm run test:unit

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests (mocked routes — no backend needed)
        run: npm run test:e2e

      - name: Production build
        run: npm run build

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/earthquake_frontend/playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Audit prod deps (non-blocking)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  # Validates the Dockerfile builds (no registry push).
  image-build:
    needs: lint-test-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: frontend/earthquake_frontend
          file: frontend/earthquake_frontend/Dockerfile
          push: false
          tags: earthquake-frontend:ci
          build-args: |
            VITE_API_BASE_URL=
