name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'frontend/earthquake_frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/earthquake_frontend/**'
      - '.github/workflows/frontend-ci.yml'

defaults:
  run:
    working-directory: frontend/earthquake_frontend

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/earthquake_frontend/.nvmrc
          cache: 'npm'
          cache-dependency-path: frontend/earthquake_frontend/package-lock.json

      - name: Install (locked)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit + component tests
        run: npm run test:unit

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests (mocked routes — no backend needed)
        run: npm run test:e2e

      - name: Production build
        run: npm run build

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/earthquake_frontend/playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Audit prod deps (non-blocking)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  # Builds the image on PRs (validation) and builds + pushes on push to main.
  image-build:
    needs: lint-test-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Authenticate only when we'll actually push (push to main, not PRs).
      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: frontend/earthquake_frontend
          file: frontend/earthquake_frontend/Dockerfile
          # Build-only on PRs; build + push on push to main.
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/earthquake-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/earthquake-frontend:${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=

  # CD trigger: pin this commit's image into the manifest and commit it back to
  # main. Argo CD (running in the cluster) detects the commit and rolls it out.
  bump-manifest:
    name: Pin image & let Argo CD deploy
    needs: image-build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write              # push the image-tag bump back to main
    # Shared group name serializes this with the backend workflow's bump job so
    # two concurrent pushes don't race on `git push`.
    concurrency:
      group: manifest-bump
      cancel-in-progress: false
    defaults:
      run:
        working-directory: .       # repo root, not frontend/earthquake_frontend
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Pin frontend image to this commit
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/earthquake-frontend:${{ github.sha }}"
          # select() scopes the update to the Deployment doc only, leaving the
          # ConfigMap/Service docs in the same file untouched.
          yq -i "(select(.kind == \"Deployment\") | .spec.template.spec.containers[0].image) = \"$IMAGE\"" k8s/30-frontend.yml

      - name: Commit & push the bump (Argo CD syncs from here)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- k8s/30-frontend.yml; then
            echo "Frontend image already pinned to ${GITHUB_SHA}; nothing to commit."
            exit 0
          fi
          git add k8s/30-frontend.yml
          git commit -m "ci(cd): deploy frontend ${GITHUB_SHA::7} [skip ci]"
          git pull --rebase origin main
          git push
