services:
  postgres:
    image: postgres:16
    container_name: earthquake_db
    restart: always
    environment:
      POSTGRES_DB: earthquake_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5440:5432"
    volumes:
      - earthquake_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_is_ready -U admin -d earthquake_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  earthquake_data: