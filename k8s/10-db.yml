---
apiVersion: v1
kind: ConfigMap
metadata:
  name: earthquake-db-config
  namespace: earthquake
  labels:
    app.kubernetes.io/name: earthquake-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: earthquake-system
data:
  POSTGRES_DB: earthquake_db
  PGDATA: /var/lib/postgresql/data/pgdata
---
apiVersion: v1
kind: Secret
metadata:
  name: earthquake-db-credentials
  namespace: earthquake
  labels:
    app.kubernetes.io/name: earthquake-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: earthquake-system
type: Opaque
stringData:
  POSTGRES_USER: admin
  POSTGRES_PASSWORD: admin
---
apiVersion: v1
kind: Service
metadata:
  name: earthquake-db
  namespace: earthquake
  labels:
    app.kubernetes.io/name: earthquake-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: earthquake-system
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: earthquake-postgres
    app.kubernetes.io/component: database
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: earthquake-postgres
  namespace: earthquake
  labels:
    app.kubernetes.io/name: earthquake-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: earthquake-system
spec:
  serviceName: earthquake-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: earthquake-postgres
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: earthquake-postgres
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: earthquake-system
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - configMapRef:
                name: earthquake-db-config
            - secretRef:
                name: earthquake-db-credentials
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\" -h 127.0.0.1"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\" -h 127.0.0.1"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi
