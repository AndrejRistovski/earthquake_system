---
apiVersion: v1
kind: ConfigMap
metadata:
  name: earthquake-backend-config
  namespace: earthquake
  labels:
    app.kubernetes.io/name: earthquake-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: earthquake-system
data:
  SPRING_DATASOURCE_URL: jdbc:postgresql://earthquake-db:5432/earthquake_db
  SPRING_DOCKER_COMPOSE_ENABLED: "false"
  APP_CORS_ALLOWED_ORIGINS: http://earthquake.local
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: earthquake-backend
  namespace: earthquake
  labels:
    app.kubernetes.io/name: earthquake-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: earthquake-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: earthquake-backend
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: earthquake-backend
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: earthquake-system
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z earthquake-db 5432; do echo waiting for db; sleep 2; done"]
      containers:
        - name: backend
          image: andrejristovskivip/earthquake-backend:1a897d551d8045d7b39f81b9da64027fe3cbeab9
          imagePullPolicy: Always # re-check Docker Hub for a new :latest on each pod (re)start
          ports:
            - name: http
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: earthquake-backend-config
          env:
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: earthquake-db-credentials
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: earthquake-db-credentials
                  key: POSTGRES_PASSWORD
          startupProbe:
            tcpSocket:
              port: 9090
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 9090
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9090
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: earthquake-backend
  namespace: earthquake
  labels:
    app.kubernetes.io/name: earthquake-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: earthquake-system
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: earthquake-backend
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 9090
      targetPort: 9090
