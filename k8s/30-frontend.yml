# React/Vite SPA served by unprivileged nginx: stateless Deployment + ClusterIP Service.
# The runtime nginx.conf comes from a ConfigMap (NOT the image's baked copy) so we can
# drop the compose-only `/api` proxy — in-cluster the Ingress routes /api to the backend,
# and the baked proxy_pass target (earthquake_backend, an underscore name) can't exist as
# a K8s Service anyway. This is the "inject config at runtime" pattern, no image rebuild.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: earthquake-frontend-nginx
  namespace: earthquake
  labels:
    app.kubernetes.io/name: earthquake-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: earthquake-system
data:
  default.conf: |
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        client_max_body_size 1m;

        # --- Compression ---------------------------------------------------
        gzip on;
        gzip_comp_level 6;
        gzip_min_length 1024;
        gzip_vary on;
        gzip_types text/css application/javascript application/json text/html image/svg+xml;

        # --- Security headers ----------------------------------------------
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;

        # NOTE: no `location /api` here — the Ingress proxies /api straight to the
        # backend Service, so this pod only ever serves static SPA assets.

        # --- Hashed, immutable assets — long cache -------------------------
        location ~* \.(?:css|js)$ {
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Frame-Options "DENY" always;
            try_files $uri =404;
        }

        # --- index.html must always revalidate so new deploys are seen -----
        location = /index.html {
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Frame-Options "DENY" always;
        }

        # --- SPA fallback --------------------------------------------------
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: earthquake-frontend
  namespace: earthquake
  labels:
    app.kubernetes.io/name: earthquake-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: earthquake-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: earthquake-frontend
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: earthquake-frontend
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: earthquake-system
    spec:
      containers:
        - name: frontend
          image: andrejristovskivip/earthquake-frontend:9d72c1bf4aa548c594b036bb736c2e44d27108f7
          imagePullPolicy: Always # re-check Docker Hub for a new :latest on each pod (re)start
          ports:
            - name: http
              containerPort: 8080
          # Overlay just the one config file; subPath leaves the rest of conf.d intact.
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: nginx-config
          configMap:
            name: earthquake-frontend-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: earthquake-frontend
  namespace: earthquake
  labels:
    app.kubernetes.io/name: earthquake-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: earthquake-system
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: earthquake-frontend
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
