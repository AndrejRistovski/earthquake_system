apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: earthquake
  namespace: earthquake
  labels:
    app.kubernetes.io/part-of: earthquake-system
spec:
  ingressClassName: traefik
  rules:
    - host: earthquake.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: earthquake-backend
                port:
                  number: 9090
          - path: /
            pathType: Prefix
            backend:
              service:
                name: earthquake-frontend
                port:
                  number: 8080
